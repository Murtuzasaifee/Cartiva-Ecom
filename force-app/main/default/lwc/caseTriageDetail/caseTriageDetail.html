<template>
    <lightning-card title="Triage Result" icon-name="standard:service_report">
        <template if:true={hasData}>
            <div class="slds-p-horizontal_medium slds-p-bottom_medium">
                <div class="slds-grid slds-gutters slds-wrap">
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Customer</span>
                        <span class="triage-field__value">{customerName}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Ticket #</span>
                        <span class="triage-field__value">{externalTicketId}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Order</span>
                        <span class="triage-field__value">{externalOrderId} <lightning-formatted-number value={orderAmount} format-style="currency"></lightning-formatted-number></span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Category</span>
                        <span class="triage-field__value">{category}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Priority</span>
                        <span class="triage-field__value">{priority}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Recommended Team</span>
                        <span class="triage-field__value">{team}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">SLA</span>
                        <span class="triage-field__value">{slaHours} hours</span>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">SLA Due</span>
                        <lightning-formatted-date-time
                            class="triage-field__value"
                            value={slaDueDate}
                            year="numeric"
                            month="short"
                            day="2-digit"
                            hour="2-digit"
                            minute="2-digit"
                        ></lightning-formatted-date-time>
                    </div>
                    <div class="slds-col slds-size_1-of-2 triage-field">
                        <span class="triage-field__label">Triage Status</span>
                        <span class="triage-field__value">{status}</span>
                    </div>
                    <div class="slds-col slds-size_1-of-1 triage-field">
                        <span class="triage-field__label">Reason</span>
                        <span class="triage-field__value">{reason}</span>
                    </div>
                </div>

                <div class="slds-m-top_medium">
                    <lightning-button
                        label="Override Triage"
                        variant="brand"
                        onclick={handleOpenOverride}
                    ></lightning-button>
                </div>

                <hr class="slds-m-vertical_medium" />

                <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_small">
                    <div class="slds-col slds-size_1-of-2">
                        <lightning-combobox
                            label="Fulfillment Status"
                            value={fulfillmentStatus}
                            options={fulfillmentStatusOptions}
                            onchange={handleFulfillmentStatusChange}
                        ></lightning-combobox>
                    </div>
                </div>

                <lightning-textarea
                    label="Resolution"
                    value={resolutionText}
                    onchange={handleResolutionChange}
                ></lightning-textarea>
                <div class="slds-m-top_small">
                    <lightning-button
                        label="Resolve Case"
                        variant="success"
                        disabled={isResolveDisabled}
                        onclick={handleResolveCase}
                    ></lightning-button>
                </div>
            </div>
        </template>

        <template if:true={isOverrideOpen}>
            <section class="slds-modal slds-fade-in-open" role="dialog">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Override Triage Decision</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            label="Category"
                            value={overrideCategory}
                            options={categoryOptions}
                            onchange={handleCategoryChange}
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Priority"
                            value={overridePriority}
                            options={priorityOptions}
                            onchange={handlePriorityChange}
                            class="slds-m-top_small"
                        ></lightning-combobox>
                        <lightning-combobox
                            label="Team"
                            value={overrideTeam}
                            options={teamOptions}
                            onchange={handleTeamChange}
                            class="slds-m-top_small"
                        ></lightning-combobox>
                        <lightning-textarea
                            label="Reason"
                            value={overrideReason}
                            onchange={handleReasonChange}
                            class="slds-m-top_small"
                            required
                        ></lightning-textarea>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button
                            label="Cancel"
                            onclick={handleCancelOverride}
                        ></lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            class="slds-m-left_x-small"
                            disabled={isSaveDisabled}
                            onclick={handleSaveOverride}
                        ></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
