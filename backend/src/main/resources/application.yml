server:
  port: 8080

spring:
  application:
    name: cartiva-backend
  datasource:
    url: jdbc:h2:file:/app/data/cartiva;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

salesforce:
  login-url: ${SALESFORCE_LOGIN_URL:https://login.salesforce.com}
  client-id: ${SALESFORCE_CLIENT_ID:}
  username: ${SALESFORCE_USERNAME:}
  jwt-private-key-path: ${SALESFORCE_JWT_PRIVATE_KEY_PATH:/app/certs/server.key}
  api-version: v60.0

cartiva:
  polling:
    enabled: ${SALESFORCE_POLLING_ENABLED:true}
    interval-ms: 10000
  retry:
    interval-ms: 60000
